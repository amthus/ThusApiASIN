services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demandes
      POSTGRES_USER: demandes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demandes"]
      interval: 3s
      retries: 20
  web:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?définir DJANGO_SECRET_KEY dans .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: demandes
      POSTGRES_USER: demandes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    ports: ["8000:8000"]
volumes:
  pgdata:
